plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goallive.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.goallive.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.13.0'
}
